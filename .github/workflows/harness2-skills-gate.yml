name: Harness2 Skills Gate
on:
  push:
    paths:
      - '.agents/skills/harness2-adaptive-engineering/**'
      - '.github/workflows/harness2-skills-gate.yml'
  pull_request:
    paths:
      - '.agents/skills/harness2-adaptive-engineering/**'
      - '.github/workflows/harness2-skills-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-evidence-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test contrastive evidence gate
        run: python -m unittest discover -s .agents/skills/harness2-adaptive-engineering/tests -v
